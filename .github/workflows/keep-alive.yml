name: Supabase Keep-Alive Ping

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Endpoint
        run: |
          # ตัด trailing slash ออกเพื่อความปลอดภัยของ URL
          BASE_URL=$(echo "${{ secrets.SUPABASE_URL }}" | sed 's:/*$::')

          # ยิง ping ไปที่ health check หรือ rest table โดยตรง
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X GET "$BASE_URL/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "Supabase Response Status: $STATUS_CODE"

          # 200 หรือ 204 หรือ 404 (ถ้า table ว่างแต่ request เข้าถึง DB สำเร็จ) ถือว่าเคาะ DB ตื่นแล้ว
          if [ "$STATUS_CODE" -ge 200 ] && [ "$STATUS_CODE" -lt 400 ]; then
            echo "Successfully pinged Supabase! Keep-alive active."
            exit 0
          else
            echo "Ping failed with status code $STATUS_CODE"
            exit 1
          fi
